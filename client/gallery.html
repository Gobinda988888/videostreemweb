<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery - desiixvideo</title>
    <meta name="description" content="Browse our extensive video gallery with interactive controls">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Animated Background */
        .gradient-bg {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1535 100%);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
            position: relative;
        }

        .gradient-bg::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(251, 191, 36, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.03) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        /* Cyber Border Effect */
        .cyber-border {
            position: relative;
            border: 2px solid rgba(251, 191, 36, 0.3);
            background: rgba(15, 21, 53, 0.5);
            backdrop-filter: blur(10px);
        }

        .cyber-border::before,
        .cyber-border::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #fbbf24;
        }

        .cyber-border::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .cyber-border::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 16px;
                padding: 16px;
            }
        }

        /* Video Card */
        .video-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid rgba(251, 191, 36, 0.2);
            background: rgba(15, 21, 53, 0.6);
            backdrop-filter: blur(10px);
        }

        .video-card:hover {
            transform: translateY(-8px);
            border-color: rgba(251, 191, 36, 0.6);
            box-shadow: 0 20px 60px rgba(251, 191, 36, 0.3),
                        0 0 40px rgba(251, 191, 36, 0.2);
        }

        .video-card video {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #000;
        }

        /* Fullscreen video styling - fills entire screen from top */
        video:fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: fill !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000 !important;
            transform: none !important;
        }

        video:-webkit-full-screen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: fill !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000 !important;
            transform: none !important;
        }

        video:-moz-full-screen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: fill !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000 !important;
            transform: none !important;
        }

        video:-ms-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: fill !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000 !important;
            transform: none !important;
        }

        /* Custom Video Controls */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
            padding: 12px;
            opacity: 1;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            border-radius: 2px;
            width: 0%;
            position: relative;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s;
            font-size: 16px;
        }

        .control-btn:hover {
            color: #fbbf24;
            transform: scale(1.1);
        }

        .volume-slider {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fbbf24;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Video Info */
        .video-info {
            padding: 16px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #9ca3af;
        }

        .video-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Top Navigation */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(251, 191, 36, 0.2);
            padding: 16px 24px;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-link {
            color: #e5e7eb;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 14px;
        }

        .nav-link:hover {
            color: #fbbf24;
        }

        /* Filter Bar */
        .filter-bar {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 20px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0e27;
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 25px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #fbbf24;
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #fbbf24;
            font-size: 18px;
        }

        .loading i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            margin-bottom: 16px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Duration Badge */
        .duration-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            z-index: 5;
        }

        /* View Mode Toggle */
        .view-toggle {
            display: flex;
            gap: 8px;
            background: rgba(251, 191, 36, 0.1);
            padding: 4px;
            border-radius: 8px;
        }

        .view-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0e27;
        }
    </style>
</head>
<body class="gradient-bg">
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-content">
            <a href="index.html" class="logo">
                <i class="fas fa-video"></i> desiixvideo
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="gallery.html" class="nav-link" style="color: #fbbf24;">
                    <i class="fas fa-th"></i> Gallery
                </a>
                <a href="dashboard.html" class="nav-link" id="dashboardLink">
                    <i class="fas fa-user"></i> Dashboard
                </a>
                <a href="login.html" class="nav-link" id="loginLink" style="display: none;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <button id="logoutBtn" class="nav-link" style="background: none; border: none; cursor: pointer; display: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search videos...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <button class="filter-btn active" data-filter="all">All Videos</button>
        <button class="filter-btn" data-filter="recent">Recent</button>
        <button class="filter-btn" data-filter="popular">Popular</button>
        <button class="filter-btn" data-filter="hd">HD Quality</button>
        <div class="view-toggle">
            <button class="view-btn active" data-view="grid">
                <i class="fas fa-th"></i>
            </button>
            <button class="view-btn" data-view="list">
                <i class="fas fa-list"></i>
            </button>
        </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid">
        <div class="loading">
            <i class="fas fa-circle-notch"></i>
            <p>Loading videos...</p>
        </div>
    </div>

    <script>
        const API_URL = window.location.protocol === 'file:' ? 'http://localhost:4000' : '';
        const R2_PUBLIC_URL = 'https://pub-3f3e96390c87412793dc8db548e237e2.r2.dev';
        let allVideos = [];

        // Optional authentication (not required)
        const token = localStorage.getItem('token');

        // Load videos
        async function loadVideos() {
            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                const response = await fetch(`${API_URL}/api/videos/list`, { headers });

                if (!response.ok) throw new Error('Failed to load videos');

                const data = await response.json();
                allVideos = Array.isArray(data) ? data : (data.videos || []);
                
                // Add full URLs for videos and thumbnails
                allVideos = allVideos.map(video => ({
                    ...video,
                    videoUrl: `${R2_PUBLIC_URL}/${video.filename}`,
                    thumbnailUrl: video.thumbnail ? `${R2_PUBLIC_URL}/${video.thumbnail}` : null
                }));
                
                displayVideos(allVideos);
            } catch (error) {
                console.error('Error loading videos:', error);
                document.getElementById('galleryGrid').innerHTML = `
                    <div class="loading">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Failed to load videos</p>
                    </div>
                `;
            }
        }

        // Display videos
        function displayVideos(videos) {
            const grid = document.getElementById('galleryGrid');
            
            if (videos.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-video-slash"></i>
                        <p>No videos found</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videos.map((video, index) => `
                <div class="video-card" data-video-id="${video._id}" data-index="${index}">
                    <video 
                        id="video-${index}" 
                        src="${video.videoUrl}" 
                        poster="${video.thumbnailUrl || ''}"
                        preload="metadata"
                        controlslist="nodownload"
                        disablePictureInPicture
                        oncontextmenu="return false;"
                        crossorigin="anonymous"
                        style="cursor: pointer;"
                    ></video>
                    
                    <span class="duration-badge" id="duration-${index}">--:--</span>
                    
                    <div class="custom-controls" id="controls-${index}">
                        <div class="progress-bar" id="progress-bar-${index}">
                            <div class="progress-filled" id="progress-${index}"></div>
                        </div>
                        <div class="control-buttons">
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <button class="control-btn play-btn" data-index="${index}">
                                    <i class="fas fa-play" id="play-icon-${index}"></i>
                                </button>
                                <button class="control-btn mute-btn" data-index="${index}">
                                    <i class="fas fa-volume-up" id="volume-icon-${index}"></i>
                                </button>
                                <input type="range" class="volume-slider" id="volume-slider-${index}" min="0" max="100" value="50" data-index="${index}">
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span style="color: white; font-size: 12px;" id="time-${index}">0:00 / 0:00</span>
                                <button class="control-btn fullscreen-btn" data-index="${index}">
                                    <i class="fas fa-expand"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                        <div class="video-meta">
                            <span><i class="fas fa-eye"></i> ${video.views || 0}</span>
                            <span><i class="fas fa-heart"></i> ${video.likes || 0}</span>
                            <span><i class="fas fa-clock"></i> ${formatDate(video.uploadDate)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            // Initialize videos and event listeners
            videos.forEach((video, index) => {
                const videoElement = document.getElementById(`video-${index}`);
                if (!videoElement) {
                    console.error(`Video element not found for index ${index}`);
                    return;
                }
                
                const videoCard = videoElement.closest('.video-card');
                
                // Video metadata loaded
                videoElement.addEventListener('loadedmetadata', () => {
                    const duration = formatTime(videoElement.duration);
                    const durationBadge = document.getElementById(`duration-${index}`);
                    if (durationBadge) {
                        durationBadge.textContent = duration;
                    }
                });

                // Update progress on time update
                videoElement.addEventListener('timeupdate', () => {
                    updateProgress(index);
                });

                // Set initial volume
                videoElement.volume = 0.5;
                
                // Click on video to navigate to watch page
                videoElement.addEventListener('click', (e) => {
                    if (!e.target.closest('.custom-controls')) {
                        window.location.href = `watch.html?id=${video._id}`;
                    }
                });
                
                // Find buttons within the same video card
                if (videoCard) {
                // Play button
                const playBtn = videoCard.querySelector('.play-btn');
                if (playBtn) {
                    playBtn.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        console.log('Play button clicked for video', index);
                        togglePlay(index);
                        return false;
                    };
                } else {
                    console.error(`Play button not found for video ${index}`);
                }
                
                // Mute button
                const muteBtn = videoCard.querySelector('.mute-btn');
                if (muteBtn) {
                    muteBtn.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        toggleMute(index);
                        return false;
                    };
                }
                
                // Volume slider
                const volumeSlider = videoCard.querySelector('.volume-slider');
                if (volumeSlider) {
                    volumeSlider.oninput = (e) => {
                        e.stopPropagation();
                        changeVolume(index, e.target.value);
                    };
                    volumeSlider.onclick = (e) => {
                        e.stopPropagation();
                    };
                }
                
                // Fullscreen button
                const fullscreenBtn = videoCard.querySelector('.fullscreen-btn');
                if (fullscreenBtn) {
                    fullscreenBtn.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        toggleFullscreen(index);
                        return false;
                    };
                }
                
                // Progress bar
                const progressBar = videoCard.querySelector('.progress-bar');
                if (progressBar) {
                    progressBar.onclick = (e) => {
                        e.stopPropagation();
                        seek(e, index);
                    };
                }
                
                // Stop propagation on controls container
                const controls = videoCard.querySelector('.custom-controls');
                if (controls) {
                    controls.onclick = (e) => {
                        e.stopPropagation();
                    };
                }
                }
            });
        }

        // Debounce helper
        let playToggleTimeout = null;
        
        // Toggle play/pause
        function togglePlay(index) {
            // Clear any pending toggles
            if (playToggleTimeout) {
                clearTimeout(playToggleTimeout);
            }
            
            // Debounce to prevent rapid clicks
            playToggleTimeout = setTimeout(() => {
                console.log('togglePlay called with index:', index);
                const video = document.getElementById(`video-${index}`);
                const icon = document.getElementById(`play-icon-${index}`);
                
                if (!video || !icon) {
                    console.error(`Video or icon element not found for index ${index}`);
                    return;
                }
                
                // Check current state and toggle
                if (video.paused || video.ended) {
                    console.log('Video is paused, attempting to play...');
                    // Pause all other videos first
                    document.querySelectorAll('video').forEach((v) => {
                        const videoId = v.id.replace('video-', '');
                        if (videoId != index && !v.paused) {
                            v.pause();
                            const otherIcon = document.getElementById(`play-icon-${videoId}`);
                            if (otherIcon) {
                                otherIcon.className = 'fas fa-play';
                            }
                        }
                    });
                    
                    // Then play this video
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            console.log('Video playing successfully');
                            icon.className = 'fas fa-pause';
                        }).catch(err => {
                            console.error('Error playing video:', err);
                        });
                    }
                } else {
                    console.log('Video is playing, pausing...');
                    video.pause();
                    icon.className = 'fas fa-play';
                }
            }, 100); // 100ms debounce
        }

        // Toggle mute
        function toggleMute(index) {
            const video = document.getElementById(`video-${index}`);
            const icon = document.getElementById(`volume-icon-${index}`);
            
            if (!video || !icon) return;
            
            video.muted = !video.muted;
            icon.className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }

        // Change volume
        function changeVolume(index, value) {
            const video = document.getElementById(`video-${index}`);
            if (!video) return;
            
            video.volume = value / 100;
            
            const icon = document.getElementById(`volume-icon-${index}`);
            if (icon) {
                if (video.volume === 0) {
                    video.muted = true;
                    icon.className = 'fas fa-volume-mute';
                } else {
                    video.muted = false;
                    icon.className = 'fas fa-volume-up';
                }
            }
        }

        // Seek video
        function seek(event, index) {
            const video = document.getElementById(`video-${index}`);
            if (!video || !video.duration) return;
            
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            video.currentTime = percent * video.duration;
        }

        // Update progress bar
        function updateProgress(index) {
            const video = document.getElementById(`video-${index}`);
            const progress = document.getElementById(`progress-${index}`);
            const timeDisplay = document.getElementById(`time-${index}`);
            
            if (video && progress && video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progress.style.width = percent + '%';
                
                const current = formatTime(video.currentTime);
                const total = formatTime(video.duration);
                timeDisplay.textContent = `${current} / ${total}`;
            }
        }

        // Toggle fullscreen
        function toggleFullscreen(index) {
            const video = document.getElementById(`video-${index}`);
            if (!video) return;
            
            if (!document.fullscreenElement) {
                // Try to fullscreen the video element itself
                if (video.requestFullscreen) {
                    video.requestFullscreen().catch(err => {
                        console.error('Error attempting to enable fullscreen:', err);
                    });
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.mozRequestFullScreen) {
                    video.mozRequestFullScreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            if (diffDays < 365) return `${Math.floor(diffDays / 30)} months ago`;
            return `${Math.floor(diffDays / 365)} years ago`;
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allVideos.filter(video => 
                video.title.toLowerCase().includes(query) ||
                (video.description && video.description.toLowerCase().includes(query)) ||
                (video.tags && video.tags.some(tag => tag.toLowerCase().includes(query)))
            );
            displayVideos(filtered);
        });

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                let filtered = [...allVideos];
                
                if (filter === 'recent') {
                    filtered.sort((a, b) => new Date(b.uploadDate) - new Date(a.uploadDate));
                } else if (filter === 'popular') {
                    filtered.sort((a, b) => (b.views || 0) - (a.views || 0));
                } else if (filter === 'hd') {
                    filtered = filtered.filter(v => v.quality === 'HD' || v.quality === '1080p');
                }
                
                displayVideos(filtered);
            });
        });

        // View mode toggle
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const grid = document.getElementById('galleryGrid');
                if (btn.dataset.view === 'list') {
                    grid.style.gridTemplateColumns = '1fr';
                } else {
                    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(320px, 1fr))';
                }
            });
        });

        // Show/hide nav links based on login status
        if (token) {
            document.getElementById('dashboardLink').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('loginLink').style.display = 'none';
        } else {
            document.getElementById('dashboardLink').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('loginLink').style.display = 'block';
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // Pause all videos when leaving page
        window.addEventListener('beforeunload', () => {
            document.querySelectorAll('video').forEach(video => {
                video.pause();
            });
        });

        // Load videos on page load
        loadVideos();
    </script>
</body>
</html>
