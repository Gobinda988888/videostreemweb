    <script src="/js/app.js"></script>
    <script>
      // Theme toggle functionality
      const themeToggle = document.getElementById('themeToggle');
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');
      const body = document.body;
      
      // Load saved theme
      const savedTheme = localStorage.getItem('theme') || 'dark';
      const mobileThemeIcon = document.getElementById('mobileThemeIcon');
      if (savedTheme === 'light') {
        body.classList.add('light-mode');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        if (mobileThemeIcon) mobileThemeIcon.textContent = '☀️';
      } else {
        if (mobileThemeIcon) mobileThemeIcon.textContent = '🌙';
      }
      
      themeToggle.addEventListener('click', () => {
        body.classList.toggle('light-mode');
        const isLight = body.classList.contains('light-mode');
        
        if (isLight) {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
          localStorage.setItem('theme', 'light');
        } else {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
          localStorage.setItem('theme', 'dark');
        }
      });
      
      // Mobile menu functionality
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      const closeMobileMenu = document.getElementById('closeMobileMenu');
      const mobileThemeToggle = document.getElementById('mobileThemeToggle');
      
      mobileMenuBtn?.addEventListener('click', () => {
        mobileMenu.style.transform = 'translateX(0)';
        document.body.style.overflow = 'hidden';
      });
      
      closeMobileMenu?.addEventListener('click', () => {
        mobileMenu.style.transform = 'translateX(100%)';
        document.body.style.overflow = '';
      });
      
      // Close menu on link click
      mobileMenu?.querySelectorAll('a, button').forEach(item => {
        item.addEventListener('click', () => {
          if (item.id !== 'closeMobileMenu' && item.id !== 'mobileThemeToggle') {
            mobileMenu.style.transform = 'translateX(100%)';
            document.body.style.overflow = '';
          }
        });
      });
      
      // Mobile theme toggle
      mobileThemeToggle?.addEventListener('click', () => {
        body.classList.toggle('light-mode');
        const isLight = body.classList.contains('light-mode');
        const mobileThemeIcon = document.getElementById('mobileThemeIcon');
        
        if (isLight) {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
          mobileThemeIcon.textContent = '☀️';
          localStorage.setItem('theme', 'light');
        } else {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
          mobileThemeIcon.textContent = '🌙';
          localStorage.setItem('theme', 'dark');
        }
      });
      
      // Avatar functionality
      const avatars = ['👤', '😊', '😎', '🤓', '😇', '🥳', '🤩', '😈', '👨', '👩', '🧔', '👱', '👨‍💼', '👩‍💼', '🦸', '🦹'];
      const avatarModal = document.getElementById('avatarModal');
      const avatarGrid = document.getElementById('avatarGrid');
      const closeAvatarModal = document.getElementById('closeAvatarModal');
      const mobileUserAvatar = document.getElementById('mobileUserAvatar');
      
      // Populate avatar grid
      avatars.forEach(emoji => {
        const btn = document.createElement('button');
        btn.className = 'w-16 h-16 text-3xl bg-gray-800 hover:bg-yellow-600 rounded-lg transition-all duration-300 transform hover:scale-110';
        btn.style.boxShadow = '0 0 10px rgba(251, 191, 36, 0.2)';
        btn.onmouseover = () => { btn.style.boxShadow = '0 0 20px rgba(251, 191, 36, 0.5)'; };
        btn.onmouseout = () => { btn.style.boxShadow = '0 0 10px rgba(251, 191, 36, 0.2)'; };
        btn.textContent = emoji;
        btn.onclick = () => {
          localStorage.setItem('userAvatar', emoji);
          updateUserAvatar();
          avatarModal.classList.add('hidden');
          document.body.style.overflow = '';
        };
        avatarGrid.appendChild(btn);
      });
      
      // Open avatar modal
      mobileUserAvatar?.addEventListener('click', () => {
        avatarModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      });
      
      // Desktop avatar open modal
      const desktopAvatarIcon = document.getElementById('desktopAvatarIcon');
      desktopAvatarIcon?.addEventListener('click', () => {
        avatarModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      });
      
      // Close avatar modal
      closeAvatarModal?.addEventListener('click', () => {
        avatarModal.classList.add('hidden');
        document.body.style.overflow = '';
      });
      
      // Close modal on backdrop click
      avatarModal?.addEventListener('click', (e) => {
        if (e.target === avatarModal) {
          avatarModal.classList.add('hidden');
          document.body.style.overflow = '';
        }
      });
      
      // Update user avatar
      function updateUserAvatar() {
        const avatar = localStorage.getItem('userAvatar') || '👤';
        if (mobileUserAvatar) {
          mobileUserAvatar.textContent = avatar;
        }
        const desktopAvatarIcon = document.getElementById('desktopAvatarIcon');
        if (desktopAvatarIcon) {
          desktopAvatarIcon.textContent = avatar;
        }
      }
      
      // Desktop avatar handlers
      const desktopChangeAvatar = document.getElementById('desktopChangeAvatar');
      const desktopLogout = document.getElementById('desktopLogout');
      const desktopUserAvatar = document.getElementById('desktopUserAvatar');
      
      desktopChangeAvatar?.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        avatarModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      });
      
      desktopLogout?.addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/';
      });
      
      // Update mobile user profile
      function updateMobileProfile() {
        const token = localStorage.getItem('token');
        const mobileUserProfile = document.getElementById('mobileUserProfile');
        const mobileUserEmail = document.getElementById('mobileUserEmail');
        
        if (token) {
          const decoded = parseJWT(token);
          if (decoded && decoded.email) {
            mobileUserProfile?.classList.remove('hidden');
            if (mobileUserEmail) {
              mobileUserEmail.textContent = decoded.email.split('@')[0];
            }
            updateUserAvatar();
          }
        } else {
          mobileUserProfile?.classList.add('hidden');
        }
      }
      
      // Parse JWT token
      function parseJWT(token) {
        try {
          const base64Url = token.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          return JSON.parse(atob(base64));
        } catch {
          return null;
        }
      }
      
      // Update mobile profile on load
      updateMobileProfile();
      
      // Track visitor on page load
      (async () => {
        try {
          await fetch('/api/analytics/track-visit', { method: 'POST' });
        } catch (err) {
          console.log('Analytics tracking failed');
        }
      })();
    </script>
