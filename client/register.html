<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>🔥 Register - AV Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .gradient-bg {
        background: linear-gradient(-45deg, #0a0e27, #0f1535, #0a0e27, #1a1f3a);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
        position: relative;
      }
      .gradient-bg::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
          radial-gradient(circle at 20% 30%, rgba(251, 191, 36, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        pointer-events: none;
      }
      @keyframes neonPulse {
        0%, 100% {
          box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), 0 0 40px rgba(251, 191, 36, 0.2), inset 0 0 20px rgba(251, 191, 36, 0.05);
        }
        50% {
          box-shadow: 0 0 40px rgba(251, 191, 36, 0.6), 0 0 80px rgba(251, 191, 36, 0.3), inset 0 0 30px rgba(251, 191, 36, 0.1);
        }
      }
    </style>
  </head>
  <body class="gradient-bg text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-3 mb-2">
          <svg width="50" height="50" viewBox="0 0 40 40">
            <defs>
              <linearGradient id="logoGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" fill="url(#logoGradient4)" opacity="0.2"/>
            <path d="M15 12 L15 28 L28 20 Z" fill="url(#logoGradient4)"/>
            <circle cx="20" cy="20" r="18" fill="none" stroke="url(#logoGradient4)" stroke-width="2"/>
          </svg>
          <h1 class="text-4xl font-black bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-400 bg-clip-text text-transparent tracking-tight" style="filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5)); letter-spacing: 0.05em;">desiixvideo</h1>
        </div>
        <p class="text-gray-400">Join the community!</p>
      </div>
      <div class="p-8 rounded-2xl relative" style="background: rgba(10, 14, 39, 0.8); backdrop-filter: blur(20px); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: 0 0 40px rgba(251, 191, 36, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.3); animation: neonPulse 3s ease-in-out infinite;">
        <h2 class="text-3xl font-bold mb-6 text-center">Register</h2>
        <form id="registerForm" class="space-y-4">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">📧</span>
            <input aria-label="email" name="email" type="email" placeholder="Email" class="w-full pl-10 p-3 rounded-lg focus:outline-none transition-all duration-300" style="background: rgba(10, 14, 39, 0.6); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);" onfocus="this.style.borderColor='rgba(251, 191, 36, 0.8)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(251, 191, 36, 0.3)'" onblur="this.style.borderColor='rgba(251, 191, 36, 0.3)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3)'" required />
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">🔒</span>
            <input aria-label="password" name="password" type="password" placeholder="Password" class="w-full pl-10 p-3 rounded-lg focus:outline-none transition-all duration-300" style="background: rgba(10, 14, 39, 0.6); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);" onfocus="this.style.borderColor='rgba(251, 191, 36, 0.8)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(251, 191, 36, 0.3)'" onblur="this.style.borderColor='rgba(251, 191, 36, 0.3)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3)'" />
          </div>
          <div id="registerError" class="hidden text-red-400 text-sm"></div>
          <button type="submit" class="w-full p-3 rounded-lg font-semibold transform hover:scale-105 transition-all duration-300" style="background: linear-gradient(135deg, rgba(251, 191, 36, 0.8) 0%, rgba(245, 158, 11, 0.8) 100%); border: 2px solid rgba(251, 191, 36, 0.5); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), inset 0 0 10px rgba(251, 191, 36, 0.2);" onmouseover="this.style.boxShadow='0 0 30px rgba(251, 191, 36, 0.6), inset 0 0 15px rgba(251, 191, 36, 0.3)'" onmouseout="this.style.boxShadow='0 0 20px rgba(251, 191, 36, 0.4), inset 0 0 10px rgba(251, 191, 36, 0.2)'">
            ✨ Create Account
          </button>
        </form>
        <p class="mt-6 text-sm text-center text-gray-400">Already have an account? <a href="/login.html" class="text-yellow-400 hover:text-yellow-300 font-semibold transition-all duration-300" style="text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);">Login</a></p>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      // Inline register handler as backup
      document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registerForm');
        if (form) {
          console.log('✅ Inline register handler loaded');
          form.addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('📝 Form submitted via inline handler');
            
            const email = form.email.value;
            const password = form.password.value;
            
              if (!email || !password) {
              document.getElementById('registerError').textContent = 'Please enter email and password';
              document.getElementById('registerError').classList.remove('hidden');
              return;
            }
            
            try {
              const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
              });
              
              const data = await response.json();
              
              if (!response.ok) {
                throw new Error(data.message || 'Registration failed');
              }
              
              console.log('✅ Registration successful!');
              localStorage.setItem('token', data.token);
              window.location.href = '/';
            } catch (err) {
              console.error('❌ Registration error:', err);
              const errEl = document.getElementById('registerError');
              errEl.textContent = 'Registration failed: ' + err.message;
              errEl.classList.remove('hidden');
            }
          });
        }
      });
    </script>
  </body>
</html>
