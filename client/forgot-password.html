<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - desiixvideo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .gradient-bg {
        background: linear-gradient(-45deg, #0a0e27, #0f1535, #0a0e27, #1a1f3a);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
        position: relative;
      }
      .gradient-bg::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
          radial-gradient(circle at 20% 30%, rgba(251, 191, 36, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        pointer-events: none;
      }
      @keyframes neonPulse {
        0%, 100% {
          box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), 0 0 40px rgba(251, 191, 36, 0.2), inset 0 0 20px rgba(251, 191, 36, 0.05);
        }
        50% {
          box-shadow: 0 0 40px rgba(251, 191, 36, 0.6), 0 0 80px rgba(251, 191, 36, 0.3), inset 0 0 30px rgba(251, 191, 36, 0.1);
        }
      }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-3 mb-2">
          <svg width="50" height="50" viewBox="0 0 40 40">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" opacity="0.2"/>
            <path d="M15 12 L15 28 L28 20 Z" fill="url(#logoGradient)"/>
            <circle cx="20" cy="20" r="18" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
          </svg>
          <h1 class="text-4xl font-black bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-400 bg-clip-text text-transparent tracking-tight" style="filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5)); letter-spacing: 0.05em;">desiixvideo</h1>
        </div>
        <p class="text-gray-400">Reset your password</p>
      </div>
      
      <div class="p-8 rounded-2xl relative" style="background: rgba(10, 14, 39, 0.8); backdrop-filter: blur(20px); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: 0 0 40px rgba(251, 191, 36, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.3); animation: neonPulse 3s ease-in-out infinite;">
        <h2 class="text-3xl font-bold mb-6 text-center">Forgot Password</h2>
        
        <div id="step1" class="space-y-4">
          <p class="text-gray-400 text-sm text-center mb-4">Enter your email and new password</p>
          <form id="resetForm" class="space-y-4">
            <div>
              <input type="email" id="email" placeholder="Email" required 
                class="w-full p-3 rounded-lg focus:outline-none transition-all duration-300" style="background: rgba(10, 14, 39, 0.6); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);" onfocus="this.style.borderColor='rgba(251, 191, 36, 0.8)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(251, 191, 36, 0.3)'" onblur="this.style.borderColor='rgba(251, 191, 36, 0.3)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3)'" />
            </div>
            <div>
              <input type="password" id="newPassword" placeholder="New Password" required minlength="6"
                class="w-full p-3 rounded-lg focus:outline-none transition-all duration-300" style="background: rgba(10, 14, 39, 0.6); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);" onfocus="this.style.borderColor='rgba(251, 191, 36, 0.8)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(251, 191, 36, 0.3)'" onblur="this.style.borderColor='rgba(251, 191, 36, 0.3)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3)'" />
            </div>
            <div>
              <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6"
                class="w-full p-3 rounded-lg focus:outline-none transition-all duration-300" style="background: rgba(10, 14, 39, 0.6); border: 2px solid rgba(251, 191, 36, 0.3); box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);" onfocus="this.style.borderColor='rgba(251, 191, 36, 0.8)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(251, 191, 36, 0.3)'" onblur="this.style.borderColor='rgba(251, 191, 36, 0.3)'; this.style.boxShadow='inset 0 2px 10px rgba(0, 0, 0, 0.3)'" />
            </div>
            <button type="submit" class="w-full p-3 rounded-lg font-semibold transform hover:scale-105 transition-all duration-300" style="background: linear-gradient(135deg, rgba(251, 191, 36, 0.8) 0%, rgba(245, 158, 11, 0.8) 100%); border: 2px solid rgba(251, 191, 36, 0.5); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), inset 0 0 10px rgba(251, 191, 36, 0.2);" onmouseover="this.style.boxShadow='0 0 30px rgba(251, 191, 36, 0.6), inset 0 0 15px rgba(251, 191, 36, 0.3)'" onmouseout="this.style.boxShadow='0 0 20px rgba(251, 191, 36, 0.4), inset 0 0 10px rgba(251, 191, 36, 0.2)'">
              🔄 Reset Password
            </button>
          </form>
        </div>
        
        <div id="result" class="mt-4 hidden"></div>
        
        <p class="mt-6 text-sm text-center text-gray-400">
          Remember your password? 
          <a href="/login.html" class="text-yellow-400 hover:text-yellow-300 font-semibold transition-all duration-300" style="text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);">Login</a>
        </p>
      </div>
    </div>

    <script>
      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const resultDiv = document.getElementById('result');
        
        if (newPassword !== confirmPassword) {
          resultDiv.className = 'mt-4 p-4 bg-red-900 border border-red-700 rounded-lg text-red-200';
          resultDiv.textContent = '❌ Passwords do not match!';
          resultDiv.classList.remove('hidden');
          return;
        }
        
        if (newPassword.length < 6) {
          resultDiv.className = 'mt-4 p-4 bg-red-900 border border-red-700 rounded-lg text-red-200';
          resultDiv.textContent = '❌ Password must be at least 6 characters!';
          resultDiv.classList.remove('hidden');
          return;
        }
        
        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, newPassword })
          });
          
          const data = await response.json();
          
          if (response.ok) {
            resultDiv.className = 'mt-4 p-4 bg-green-900 border border-green-700 rounded-lg text-green-200';
            resultDiv.innerHTML = `
              ✅ <strong>Password Reset Successful!</strong><br>
              You can now <a href="/login.html" class="underline">login</a> with your new password.
            `;
            resultDiv.classList.remove('hidden');
            document.getElementById('resetForm').style.display = 'none';
          } else {
            resultDiv.className = 'mt-4 p-4 bg-red-900 border border-red-700 rounded-lg text-red-200';
            resultDiv.textContent = '❌ ' + (data.message || 'Password reset failed');
            resultDiv.classList.remove('hidden');
          }
        } catch (err) {
          resultDiv.className = 'mt-4 p-4 bg-red-900 border border-red-700 rounded-lg text-red-200';
          resultDiv.textContent = '❌ Error: ' + err.message;
          resultDiv.classList.remove('hidden');
        }
      });
    </script>
</body>
</html>
